# Ícone do launcher. Master vetor transparente em
# `assets/icon/decima_icon_master.svg` (glifo "1.0" — barra + ponto decimal +
# anel vazado); fontes de build em `assets/icon/` (full-bleed p/ web, squircle
# com margens p/ macOS + camadas do adaptive icon). PNGs derivados via
# `tool/icon` (npm run render).
# Regenerar com `dart run flutter_launcher_icons` — não editar os PNGs nativos.
flutter_launcher_icons:
  # Android
  android: true
  # iOS: plataforma removida do escopo do projeto — ver `plano/changelog.md`
  # Web
  web:
    generate: true
    image_path: assets/icon/decima_icon_fullbleed.png
  # Windows: NÃO gerar aqui — o shell do Windows não aplica máscara, então o
  # `app_icon.ico` (multi-tamanho, cantos arredondados do master squircle) é
  # gerado pelo próprio pipeline em `tool/icon/render.mjs`. Reativar isto
  # sobrescreveria o .ico com o full-bleed quadrado de 48 px.
  windows:
    generate: false
  # Linux: NÃO existe suporte no flutter_launcher_icons (a chave `linux` era
  # ignorada silenciosamente). O ícone do Linux vem do tema hicolor, gerado
  # pelo `tool/icon` a partir do master e instalado junto do `.desktop` —
  # ver `linux/packaging/` e `docs/fundacao/empacotamento-linux.md`.
  # macOS: como Windows/Linux, o sistema NÃO aplica máscara — e a convenção
  # Big Sur exige margens (squircle 824 px em canvas 1024 transparente),
  # senão o ícone sai quadrado e maior que os vizinhos no Dock. O PNG é o
  # master escalado/centralizado pelo `tool/icon/render.mjs`.
  macos:
    generate: true
    image_path: assets/icon/decima_icon_macos.png

  # Imagem-fonte para Android (alta resolução, opaca, sem squircle —
  # a plataforma aplica a própria máscara)
  image_path: assets/icon/decima_icon_fullbleed.png

  # Adaptive icon (Android 8+): fundo com o gradiente e glifo "1.0" na frente
  # (75%, dentro da safe zone), preservando a identidade sob qualquer máscara
  adaptive_icon_background: assets/icon/decima_icon_background.png
  adaptive_icon_foreground: assets/icon/decima_icon_foreground.png
  # Themed icon (Android 13+): o sistema tinge a silhueta do glifo
  adaptive_icon_monochrome: assets/icon/decima_icon_foreground.png

  min_sdk_android: 21

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1536" width="1536" height="1536">
  <!-- Ícone da splash Android 12+ (`windowSplashScreenAnimatedIcon`).
       Canvas 1536² com o medalhão squircle de 1024 centrado (medalhão ocupa
       66,7% — dentro do círculo seguro de 2/3 do splash do Android 12+).
       Mesma geometria do master `decima_icon_master.svg`, transladada
       (+256, +256). -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4D8DF3"/>
      <stop offset="100%" stop-color="#005CEE"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect x="256" y="256" width="1024" height="1024" rx="229" ry="229"/>
    </clipPath>
    <mask id="cuts">
      <rect width="1536" height="1536" fill="#FFFFFF"/>
      <circle cx="928" cy="768" r="80" fill="#000000"/>
    </mask>
  </defs>
  <g clip-path="url(#squircle)">
    <rect x="256" y="256" width="1024" height="1024" fill="url(#bg)"/>
    <g mask="url(#cuts)">
      <rect x="408" y="568" width="120" height="400" rx="60" ry="60" fill="#FFFFFF"/>
      <circle cx="628" cy="908" r="60" fill="#FFFFFF"/>
      <circle cx="928" cy="768" r="200" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
